name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sanad:sanad@localhost:5432/sanad
      TEST_DATABASE_URL: postgresql://sanad:sanad@localhost:5432/sanad_test
      SESSION_SECRET: ci-only-test-secret-0123456789abcdef
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm test
      - name: npm audit (report only)
        run: npm audit --omit=dev || true

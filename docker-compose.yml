services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: sanad
    expose:
      - "5432"
    volumes:
      - sanad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanad -d sanad"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration job (has the Prisma CLI via devDependencies).
  migrate:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanad:${POSTGRES_PASSWORD}@db:5432/sanad
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: postgresql://sanad:${POSTGRES_PASSWORD}@db:5432/sanad
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set}
      TRUST_PROXY: "false"
      # Optional first platform administrator. Set both email and password,
      # sign in at /admin, enable MFA, then remove the password and restart.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-}
      STORAGE_DIR: /app/data/uploads
    volumes:
      - sanad-uploads:/app/data/uploads

volumes:
  sanad-pgdata:
  sanad-uploads:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanad
      POSTGRES_PASSWORD: sanad
      POSTGRES_DB: sanad
    ports:
      - "5432:5432"
    volumes:
      - sanad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanad -d sanad"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration job (has the Prisma CLI via devDependencies).
  migrate:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sanad:sanad@db:5432/sanad
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: postgresql://sanad:sanad@db:5432/sanad
      SESSION_SECRET: ${SESSION_SECRET:-local-only-insecure-compose-secret-0123456789}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: "false"

volumes:
  sanad-pgdata:
